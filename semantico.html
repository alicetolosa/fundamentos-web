<!doctype html> <!-- Informa ao navegador que o arquivo é HTML5-->
<html lang="pt-br"> <!-- idioma da página é português do Brasil-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Loja</title>
  </head>

  <body>
    <!--Header: localizada no topo da página, contém o título ou logotipo do site e o menu de navegação;-->
    <header>
      <h1>Minha Loja</h1>
    </header>

    <!-- NAV: menu de navegação com links -->
    <nav>
      <a href="">Home</a> <!-- Link para página inicial -->
      <a href="">Produtos</a> <!-- Link para página de produtos -->
      <a href="">Contato</a> <!-- Link para página de contato -->
    </nav>
    
    <!-- MAIN: conteúdo principal da página -->
    <main>

      <!-- SECTION: seção de produtos -->
      <section> 
        <h2>Produtos</h2>

        <img src="produto.jpg" alt="Produto" />

        <p>Notebook Gamer</p>
      </section>

      <!-- SECTION: seção de contato -->
      <section> 
        <h2>Contato</h2>

        <form> <!-- FORM: formulário para enviar dados -->
          <label>Nome:</label>  

          <input type="text" placeholder="Digite seu nome" required />

          <button>Enviar</button>
        </form>

      </section>
    </main>

    <!-- FOOTER: rodapé da página -->
  <footer>
    <footer>
      <p>Todos os direitos reservados</p>
    </footer>
  </body>
</html>
